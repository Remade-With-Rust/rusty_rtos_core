[package]
name = "rusty_rtos_core-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Coverage-guided, model-checked fuzzing of the arena and the lists (hardening gates H-26/H-27/H-28)."

# Test tooling, never shipped: `libfuzzer-sys` builds libFuzzer, which is C++.
# This is its own workspace, so none of it reaches this crate's dependency
# graph, its `cargo vet` / `cargo deny` scope, or tools/no-c-audit.sh.
[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
rusty_rtos_core = { path = "../crates/rusty_rtos_core", default-features = false }

[[bin]]
name = "lists_arena"
path = "fuzz_targets/lists_arena.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]

[profile.release]
debug = 1
