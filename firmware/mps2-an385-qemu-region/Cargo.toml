# Its own cargo project and its own workspace: the parent excludes
# `firmware/*` because every cell wants its own target and linker script.
[package]
name = "mps2-an385-qemu-region"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
rusty_rtos_alloc = { path = "../../crates/rusty_rtos_alloc", default-features = false, features = [
    "small-metal",
] }
cortex-m = "0.7"
cortex-m-rt = "0.7"
cortex-m-semihosting = "0.5"
panic-semihosting = "0.6"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = true

[workspace]
