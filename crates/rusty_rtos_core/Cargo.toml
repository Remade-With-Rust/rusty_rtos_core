[package]
name = "rusty_rtos_core"
description = "The shared vocabulary of the Kairos family (FreeRTOS remade in Rust): ticks, priorities, generational handles, an index-linked remake of list.c, one Copy error, the Config trait, and the Port / Heap / Trace / Hooks seams. No pointers, no allocator, no arch. forbid(unsafe)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "../../README.md"
documentation = "https://docs.rs/rusty_rtos_core"
keywords = ["rtos", "freertos", "embedded", "no-std", "remade-with-rust"]
categories = ["embedded", "no-std", "no-std::no-alloc", "os"]

[features]
default = ["std"]
# The feature ladder is the rusty_zstd one: `std` implies `alloc`; with neither,
# the crate is pure `core` and still builds on Cortex-M and RISC-V bare metal.
std = ["alloc"]
alloc = []

[dependencies]

[lints]
workspace = true
